<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Innovation Center | Jens Wölm</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f4ee;
            --text-main: #2b2623;
            --text-muted: #6e655f;
            --wood-primary: #8c5a3c;
            --wood-light: #e8ded1;
            --border-color: #e0d6c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
        }

        h1, h2, h3, .logo {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(247, 244, 238, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--wood-primary);
            text-decoration: none;
            text-transform: uppercase;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            margin-left: 2rem;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--wood-primary);
        }

        /* Hero Banner */
        .project-hero {
            height: 70vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding-bottom: 4rem;
        }

        .project-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(23, 20, 18, 0.8) 0%, transparent 70%);
        }

        .hero-title-box {
            position: relative;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 0 2rem;
            color: #ffffff;
        }

        .hero-title-box h1 {
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            margin-bottom: 0.5rem;
        }

        .hero-title-box p {
            color: var(--wood-light);
            font-size: 1.1rem;
        }

        /* Content Layout */
        .content-wrap {
            max-width: 1100px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .project-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 3.5rem;
        }

        .meta-item span {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--wood-primary);
            font-weight: 600;
        }

        .meta-item strong {
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .project-story {
            font-size: 1.15rem;
            max-width: 800px;
            color: var(--text-muted);
            margin-bottom: 4rem;
        }

        /* Pläne & Detailgalerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 5rem;
        }

        .gallery-card {
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #fff;
        }

        .gallery-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .gallery-card img:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        .gallery-caption {
            padding: 1rem 1.2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Nächstes Projekt Pagination */
        .project-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 0;
            border-top: 1px solid var(--border-color);
        }

        .project-nav a {
            text-decoration: none;
            color: var(--wood-primary);
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Modal / Lightbox Styling mit Zoom */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            inset: 0;
            background-color: rgba(23, 20, 18, 0.92);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            cursor: zoom-in;
            transition: transform 0.25s ease;
            transform-origin: center center;
        }

        .modal-content.zoomed {
            transform: scale(2.5);
            cursor: zoom-out;
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 2.5rem;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s ease;
            z-index: 2001;
        }

        .modal-close:hover {
            color: var(--wood-primary);
        }
    </style>
</head>
<body>

    <header>
        <a href="cv.html" class="logo">Jens Wölm</a>
        <nav>
            <a href="index.html">← back to project overview</a>
            <a href="cv.html">About Me</a>
        </nav>
    </header>

    <div class="project-hero" id="project-hero">
        <div class="hero-title-box">
            <h1 id="hero-title">Loading...</h1>
            <p id="hero-subtitle">Loading...</p>
        </div>
    </div>

    <main class="content-wrap">
        <!-- Projektdatenblatt -->
        <div class="project-meta-grid">
            <div class="meta-item">
                <span>Typology</span>
                <strong id="meta-typology">-</strong>
            </div>
            <div class="meta-item">
                <span>Material</span>
                <strong id="meta-material">-</strong>
            </div>
            <div class="meta-item">
                <span>Location</span>
                <strong id="meta-location">-</strong>
            </div>
            <div class="meta-item">
                <span>Year</span>
                <strong id="meta-year">-</strong>
            </div>
        </div>

        <!-- Konzepttext -->
        <div class="project-story" id="project-story"></div>

        <!-- Bildgalerie: Pläne, Schnitte, Details -->
        <h2 style="font-size: 1.6rem; margin-bottom: 1.5rem; color: var(--wood-primary);">Drawings & Model Details</h2>
        <div class="gallery-grid" id="gallery-grid"></div>

        <!-- Weiterblättern -->
        <div class="project-nav">
            <a href="index.html">← back to home page</a>
            <a href="#" id="next-project-link">next project →</a>
        </div>
    </main>

    <!-- Lightbox Modal Container -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg" alt="Vergrößerte Ansicht">
    </div>

    <!-- Interaktion mit JavaScript: Daten aus content.json auslesen -->
    <script>
        fetch('content.json')
            .then(response => response.json())
            .then(data => {
                const detail = data.projectDetails.kulturzentrum;

                // Hero setzen
                document.getElementById('project-hero').style.backgroundImage = `url('${detail.heroImage}')`;
                document.getElementById('hero-title').textContent = detail.title;
                document.getElementById('hero-subtitle').textContent = detail.subtitle;

                // Metadaten setzen
                document.getElementById('meta-typology').textContent = detail.meta.typology;
                document.getElementById('meta-material').textContent = detail.meta.material;
                document.getElementById('meta-location').textContent = detail.meta.location;
                document.getElementById('meta-year').textContent = detail.meta.year;

                // Story / Beschreibung rendern
                const storyContainer = document.getElementById('project-story');
                storyContainer.innerHTML = detail.story.map((paragraph, index) => `
                    <p ${index > 0 ? 'style="margin-top: 1.2rem;"' : ''}>${paragraph}</p>
                `).join('');

                // Galerie rendern
                const galleryContainer = document.getElementById('gallery-grid');
                galleryContainer.innerHTML = detail.gallery.map(item => `
                    <div class="gallery-card">
                        <img src="${item.src}" alt="${item.caption}">
                        <div class="gallery-caption">${item.caption}</div>
                    </div>
                `).join('');

                // Link für nächstes Projekt setzen
                const nextLink = document.getElementById('next-project-link');
                nextLink.href = detail.nextProjectLink;
                nextLink.textContent = `next project: ${detail.nextProjectTitle} →`;

                // Event-Listener für Galerie-Bilder (Lightbox) aktivieren
                document.querySelectorAll('.gallery-card img').forEach(img => {
                    img.addEventListener('click', function(e) {
                        e.stopPropagation();
                        modal.style.display = 'flex';
                        modalImg.src = this.src;
                        modalImg.alt = this.alt;
                    });
                });
            })
            .catch(error => console.error('Error loading content.json:', error));

        // Lightbox Zoom & Schließen Steuerung
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');

        modalImg.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('zoomed');
        });

        modalImg.addEventListener('mousemove', function(e) {
            if (this.classList.contains('zoomed')) {
                const rect = this.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                this.style.transformOrigin = `${x}% ${y}%`;
            }
        });

        function closeModal() {
            modal.style.display = 'none';
            modalImg.classList.remove('zoomed');
            modalImg.style.transformOrigin = 'center center';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
